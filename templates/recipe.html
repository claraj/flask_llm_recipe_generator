{% extends 'base.html' %}
{% block content %}

<h2>{{ recipe.recipe_name }}</h2>

<h3>Ingredients</h3>

<ul>
    {% for ingredient in recipe.ingredients %}
        <li>{{ ingredient }}</li>
    {% endfor %}
</ul>

<h3>Instructions</h3>

<ul>
    {% for instruction in recipe.instructions %}
        <li>{{ instruction }}</li>
    {% endfor %}
</ul>


{% endblock %}
